[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fda-strategy-triples"
version = "0.1.0"
description = "ETL pipeline and curated dataset of gene→variant_context→FDA-drug→target→mechanism tuples for rare diseases"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Amit Shenoy", email = "shenoy.am@husky.neu.edu" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Database",
]
keywords = [
    "rare disease", "FDA", "drug mechanism", "pharmacogenomics",
    "antisense oligonucleotide", "siRNA", "gene therapy",
    "enzyme replacement therapy", "CFTR", "dataset", "bioinformatics",
]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "datasets>=2.19.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.scripts]
fda-fetch    = "fda_strategy_triples.fetch.openfda:app"
fda-extract  = "fda_strategy_triples.extract.extractor:app"
fda-review   = "fda_strategy_triples.validate.reviewer_cli:app"
fda-export   = "fda_strategy_triples.export.to_jsonl:app"

[project.urls]
Repository    = "https://github.com/ashenoy00000/fda-strategy-triples"
"Bug Tracker" = "https://github.com/ashenoy00000/fda-strategy-triples/issues"
Changelog     = "https://github.com/ashenoy00000/fda-strategy-triples/blob/main/CHANGELOG.md"
"Dataset Card" = "https://github.com/ashenoy00000/fda-strategy-triples/blob/main/data/DATASET_CARD.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fda_strategy_triples" = [
    "releases/**/*.jsonl",
    "releases/**/*.csv",
    "releases/**/*.parquet",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
